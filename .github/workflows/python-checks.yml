name: Python checks

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pandas numpy python-dotenv requests

      - name: Compile Python modules
        run: python -m compileall -q src

      - name: Run data pipeline unit tests
        run: |
          python -m unittest src.data_engineering.test_news_features
          python -m unittest src.data_engineering.test_options_selection
